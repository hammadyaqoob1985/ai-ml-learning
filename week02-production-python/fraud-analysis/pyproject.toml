[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-analysis"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141,<1.0",
    "pydantic>=2.13,<3.0",
    "uvicorn>=0.52,<1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10.0",
    "httpx2>=2.12,<3.0"
]

[tool.setuptools.packages.find]
where = ["src"]
